<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<script src="./image-slot.js"></script>
<style>
@keyframes rmGlow{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes rmSpark{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
</style>
</helmet>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ close }}" style="position:fixed;inset:0;z-index:220;background:rgba(8,6,4,.8);display:flex;align-items:center;justify-content:center;padding:24px">
<div onClick="{{ stop }}" style="position:relative;width:560px;max-width:100%;max-height:92vh;overflow:auto;background:var(--panel);border-radius:20px;box-shadow:0 40px 90px rgba(0,0,0,.5);color:#fff;text-align:center;padding:48px 40px 40px">

<div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:300px;height:220px;background:radial-gradient(ellipse at center, var(--accent-light) 0%, transparent 70%);opacity:.35;animation:rmGlow 3.5s ease-in-out infinite;pointer-events:none"></div>
<div onClick="{{ close }}" style="position:absolute;top:18px;right:20px;cursor:pointer;font-size:22px;opacity:.7;z-index:2">×</div>

<div style="position:relative;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-light);font-weight:700">Nouveauté à venir</div>
<div style="position:relative;font-family:'Playfair Display',serif;font-size:32px;font-weight:700;margin:14px 0 8px;line-height:1.25">Quelque chose de nouveau se prépare</div>
<p style="position:relative;font-size:14px;color:oklch(78% 0.01 75);max-width:400px;margin:0 auto 28px">Préparez-vous à découvrir <strong style="color:#fff">La Revue Alliance</strong> — enseignements, témoignages et réflexions dans un tout nouveau rendez-vous.</p>

<div style="position:relative;width:180px;height:250px;margin:0 auto 26px;border-radius:6px;overflow:hidden;box-shadow:0 20px 45px rgba(0,0,0,.4)" style-hover="--veil-op:.15">
<image-slot id="revue-modal-cover" shape="rect" style="width:100%;height:100%" placeholder="Couverture"></image-slot>
<div style="position:absolute;inset:0;pointer-events:none;background:rgba(15,12,8,var(--veil-op,.35));transition:background .4s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
<div style="font-size:26px">👁</div>
<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:oklch(90% 0.01 75)">À découvrir</div>
</div>
<div style="position:absolute;bottom:8px;right:8px;left:8px;display:flex;justify-content:center;gap:6px;pointer-events:none">
<span style="width:5px;height:5px;border-radius:50%;background:var(--accent-light);animation:rmSpark 2.2s ease-in-out infinite"></span>
<span style="width:5px;height:5px;border-radius:50%;background:var(--accent-light);animation:rmSpark 2.2s ease-in-out .3s infinite"></span>
<span style="width:5px;height:5px;border-radius:50%;background:var(--accent-light);animation:rmSpark 2.2s ease-in-out .6s infinite"></span>
</div>
</div>

<div style="position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border:1px solid var(--accent-light);border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-light);margin-bottom:26px">📅 Date à venir — restez connectés</div>

<div style="position:relative;display:flex;gap:10px;max-width:380px;margin:0 auto">
<div style="flex:1;padding:14px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;font-size:14px;color:oklch(75% 0.01 75);text-align:left">Votre adresse e-mail</div>
<div onClick="{{ close }}" style="padding:14px 22px;background:var(--accent);color:var(--panel);font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .25s ease" style-hover="background:var(--accent-light)">M'informer</div>
</div>

</div>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: false };
  componentDidMount() {
    this._onClick = (e) => {
      const trigger = e.target.closest && e.target.closest('[data-open-revue-modal]');
      if (trigger) this.setState({ open: true });
    };
    document.addEventListener('click', this._onClick);
  }
  componentWillUnmount() {
    document.removeEventListener('click', this._onClick);
  }
  renderVals() {
    return {
      open: this.state.open,
      close: () => this.setState({ open: false }),
      stop: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
